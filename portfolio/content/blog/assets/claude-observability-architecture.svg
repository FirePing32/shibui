<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 528" width="880" height="528" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="880" height="528" rx="10" fill="#f7f8fa"/>

  <text x="28" y="38" font-size="17" font-weight="600" fill="#1f2933">Machines push, the server merges</text>
  <text x="28" y="60" font-size="13" fill="#6b7280">Nothing is pulled from Anthropic. Every enrolled machine uploads usage numbers for the same Claude account.</text>

  <!-- machine -->
  <rect x="28" y="84" width="260" height="300" rx="10" fill="#ffffff" stroke="#b8c1cc" stroke-width="1.8"/>
  <text x="44" y="106" font-size="13" font-weight="600" fill="#3e4c59">each machine</text>
  <text x="272" y="106" font-size="11" fill="#9aa5b1" text-anchor="end">× N</text>

  <rect x="44" y="118" width="228" height="52" rx="7" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="158" y="140" font-size="13.5" font-weight="600" fill="#1f2933" text-anchor="middle">Claude Code</text>
  <text x="158" y="158" font-size="11" fill="#8b93a1" text-anchor="middle">terminal · desktop app · IDE</text>

  <path d="M158 170 L158 196" stroke="#9aa5b1" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="166" y="187" font-size="10.5" fill="#6b7280">appends</text>

  <rect x="44" y="196" width="228" height="40" rx="7" fill="#eef2f6" stroke="#bcccdc" stroke-width="1.5"/>
  <text x="158" y="220" font-size="11" fill="#334e68" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">~/.claude/projects/**.jsonl</text>

  <path d="M158 236 L158 262" stroke="#9aa5b1" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="166" y="253" font-size="10.5" fill="#6b7280">reads new bytes</text>

  <rect x="44" y="262" width="228" height="108" rx="8" fill="#f0f4f8" stroke="#9fb3c8" stroke-width="1.6"/>
  <text x="60" y="284" font-size="13" font-weight="600" fill="#334e68">claude-obs</text>
  <text x="60" y="304" font-size="10.5" fill="#6b7280">tail from saved byte offsets</text>
  <text x="60" y="320" font-size="10.5" fill="#6b7280">allowlisted fields only</text>
  <text x="60" y="336" font-size="10.5" fill="#6b7280">one row per request id</text>
  <text x="60" y="352" font-size="10.5" fill="#6b7280">durable outbox → upload</text>

  <!-- leads -->
  <rect x="44" y="404" width="228" height="54" rx="7" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="158" y="426" font-size="13.5" font-weight="600" fill="#1f2933" text-anchor="middle">Leads</text>
  <text x="158" y="444" font-size="11" fill="#8b93a1" text-anchor="middle">in a browser, signed in with Google</text>

  <!-- server -->
  <rect x="320" y="84" width="532" height="390" rx="10" fill="#ffffff" stroke="#b8c1cc" stroke-width="1.8"/>
  <text x="338" y="106" font-size="13" font-weight="600" fill="#3e4c59">Next.js app + Postgres</text>
  <text x="836" y="106" font-size="11" fill="#9aa5b1" text-anchor="end">one deployment</text>

  <!-- otel -->
  <path d="M272 144 L338 144" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="305" y="136" font-size="10.5" fill="#6b7280" text-anchor="middle">OTel</text>
  <rect x="338" y="118" width="150" height="52" rx="7" fill="#eef2f6" stroke="#bcccdc" stroke-width="1.5"/>
  <text x="413" y="140" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">OTLP receiver</text>
  <text x="413" y="158" font-size="10.5" fill="#6b7280" text-anchor="middle">optional · logs + metrics</text>

  <!-- ingest -->
  <path d="M272 316 L338 316" stroke="#9aa5b1" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="305" y="308" font-size="10.5" fill="#6b7280" text-anchor="middle">gzip</text>
  <rect x="338" y="262" width="150" height="108" rx="7" fill="#eef2f6" stroke="#bcccdc" stroke-width="1.5"/>
  <text x="413" y="284" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Ingest</text>
  <text x="354" y="304" font-size="10.5" fill="#6b7280">device token (hashed)</text>
  <text x="354" y="320" font-size="10.5" fill="#6b7280">account pin (HMAC)</text>
  <text x="354" y="336" font-size="10.5" fill="#6b7280">e-mail proof</text>
  <text x="354" y="352" font-size="10.5" fill="#6b7280">shared zod schema</text>

  <!-- merge -->
  <path d="M488 144 L600 144 L600 180" stroke="#9aa5b1" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <path d="M488 316 L600 316 L600 260" stroke="#9aa5b1" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <rect x="520" y="180" width="160" height="80" rx="8" fill="#f0f4f8" stroke="#9fb3c8" stroke-width="1.6"/>
  <text x="600" y="204" font-size="13" font-weight="600" fill="#334e68" text-anchor="middle">Merge &amp; price</text>
  <text x="600" y="224" font-size="10.5" fill="#6b7280" text-anchor="middle">upsert by request id</text>
  <text x="600" y="242" font-size="10.5" fill="#6b7280" text-anchor="middle">output only ever grows</text>

  <!-- postgres -->
  <path d="M680 220 L712 220" stroke="#9aa5b1" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="712" y="180" width="124" height="80" rx="8" fill="#ffffff" stroke="#829ab1" stroke-width="1.6"/>
  <text x="774" y="208" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Postgres</text>
  <text x="774" y="228" font-size="10.5" fill="#6b7280" text-anchor="middle">requests · sessions</text>
  <text x="774" y="244" font-size="10.5" fill="#6b7280" text-anchor="middle">machines · limits</text>

  <!-- dashboard -->
  <path d="M712 248 L696 248 L696 425 L680 425" stroke="#9aa5b1" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <rect x="338" y="392" width="342" height="66" rx="7" fill="#eef2f6" stroke="#bcccdc" stroke-width="1.5"/>
  <text x="354" y="414" font-size="13" font-weight="600" fill="#1f2933">Dashboard</text>
  <text x="354" y="432" font-size="10.5" fill="#6b7280">server-rendered pages · server actions · charts</text>
  <text x="354" y="448" font-size="10.5" fill="#6b7280">e-mail allowlist · workspace membership on every query</text>
  <path d="M272 431 L338 431" stroke="#9aa5b1" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- jobs -->
  <path d="M774 260 L774 392" stroke="#9aa5b1" stroke-width="1.5" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <rect x="712" y="392" width="124" height="66" rx="7" fill="#eef2f6" stroke="#bcccdc" stroke-width="1.5"/>
  <text x="774" y="414" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Scheduled jobs</text>
  <text x="774" y="432" font-size="10.5" fill="#6b7280" text-anchor="middle">alerts · AI digest</text>
  <text x="774" y="448" font-size="10.5" fill="#6b7280" text-anchor="middle">retention</text>

  <text x="28" y="496" font-size="11.5" fill="#6b7280">The same request can arrive from two sources, two machines or a re-sync. It is stored once.</text>
  <text x="28" y="514" font-size="11.5" fill="#6b7280">Only usage numbers cross the wire: no prompts, responses, code, file contents or full paths.</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa5b1"/>
    </marker>
  </defs>
</svg>
